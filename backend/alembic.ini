[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url sengaja TIDAK diisi di sini: `migrations/env.py` mengambil
# DATABASE_URL dari `app.config` (file `.env`), supaya migrasi dan aplikasi
# tidak mungkin menunjuk database berbeda. Tes boleh menimpanya lewat
# `Config.set_main_option("sqlalchemy.url", ...)`.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
